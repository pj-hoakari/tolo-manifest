# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
    LOCAL_DIR: overlays/local
    TOLO_DIR: '{{.TOLO_DIR | default "../tolo"}}'

tasks:
    render:
        desc: Render the base.
        cmds:
            - kustomize build base

    lint:
        desc: Render the base and every overlay.
        cmds:
            - kustomize build base >/dev/null
            - kustomize build {{.LOCAL_DIR}} >/dev/null

    local:secrets:
        desc: Generate the Secret inputs of the local overlay once.
        status:
            - test -f {{.LOCAL_DIR}}/signing-key.pem
            - test -f {{.LOCAL_DIR}}/secrets.env
        cmds:
            - openssl ecparam -name prime256v1 -genkey -noout -out {{.LOCAL_DIR}}/signing-key.pem
            - |
              {
                echo "introspection-client-secret=$(openssl rand -hex 16)"
                for svc in tenant-management graph-authoring observation operation guest realtime; do
                  echo "${svc}-db-password=$(openssl rand -hex 16)"
                done
              } > {{.LOCAL_DIR}}/secrets.env
            - chmod 600 {{.LOCAL_DIR}}/signing-key.pem {{.LOCAL_DIR}}/secrets.env

    local:images:
        desc: Pull the published images of the base, and build the Firebase emulator image of the local overlay with the tolo repository's Compose (TOLO_DIR).
        cmds:
            - kustomize build base | yq -N '.. | select(has("image")) | .image' | sort -u | xargs -n 1 docker pull -q
            - task: local:firebase-emulator

    local:firebase-emulator:
        internal: true
        dir: '{{.TOLO_DIR}}'
        dotenv: [".env"]
        env:
            COMPOSE_FILE: compose.yml:compose.edge.yml
        cmds:
            - docker compose build firebase-emulator
            - docker tag "$(docker compose config --images firebase-emulator)" ghcr.io/pj-hoakari/tolo-firebase-emulator:local

    local:check-images:
        desc: Fail when an image of the base is missing from the local Docker.
        cmds:
            - |
              missing=0
              for image in $(kustomize build base | yq -N '.. | select(has("image")) | .image' | sort -u); do
                docker image inspect "$image" >/dev/null 2>&1 || { echo "missing: $image" >&2; missing=1; }
              done
              exit $missing

    local:up:
        desc: Apply the local overlay to the current kubectl context.
        deps: [local:secrets]
        cmds:
            - kubectl -n tolo delete job seed --ignore-not-found
            - kubectl apply -k {{.LOCAL_DIR}}
            - kubectl -n tolo rollout status deploy --timeout=10m
            - kubectl -n tolo rollout status statefulset --timeout=10m

    local:down:
        desc: Delete everything the local overlay created, the namespace and the database volumes included.
        cmds:
            - kubectl delete -k {{.LOCAL_DIR}} --ignore-not-found
