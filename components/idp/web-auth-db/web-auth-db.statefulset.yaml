apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-auth-db
spec:
  serviceName: web-auth-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-auth-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-auth-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: schema
          image: ghcr.io/pj-hoakari/tolo-web
          command: ["cp", "/app/db/auth.sql", "/schema/auth.sql"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: schema
              mountPath: /schema
      containers:
        - name: postgres
          image: postgres
          env:
            - name: POSTGRES_DB
              value: tolo_web_auth
            - name: POSTGRES_USER
              value: tolo_web_auth
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tolo-idp
                  key: web-auth-db-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tolo_web_auth", "-d", "tolo_web_auth"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: schema
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
