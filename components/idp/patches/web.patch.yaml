apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          command: ["node", "server.js"]
          volumeMounts:
            - mountPath: /etc/tolo/web
              $patch: delete
          env:
            - name: AUTH_MOCKING
              value: disabled
            - name: FAKEIDP_URL
              $patch: delete
            - name: TOLO_TENANT_ID
              $patch: delete
            - name: TOLO_EVENT_ID
              $patch: delete
            - name: TOLO_OWNER_SUB
              $patch: delete
            - name: TOLO_TOKEN_TTL_SECONDS
              $patch: delete
            - name: WEB_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: tolo-idp-public
                  key: web-origin
            - name: AUTH_IDP_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: tolo-idp-public
                  key: issuer
            - name: AUTH_RESOURCE_HOST
              value: api.example.com
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: tolo-idp
                  key: web-auth-secret
            - name: WEB_AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tolo-idp
                  key: web-auth-db-password
            - name: AUTH_DATABASE_URL
              value: postgres://tolo_web_auth:$(WEB_AUTH_DB_PASSWORD)@web-auth-db:5432/tolo_web_auth
            - name: AUTH_IDP_CLIENT_ID
              value: console-ui
            - name: AUTH_IDP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tolo-idp
                  key: console-ui-client-secret
            - name: AUTH_IDP_CONNECTION_CLIENT_ID
              value: observation-connection
            - name: AUTH_IDP_CONNECTION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tolo-idp
                  key: observation-connection-client-secret
            - name: AUTH_CONNECTION_REDIRECT_URI
              value: $(WEB_ORIGIN)/api/auth/connection/callback
            - name: AUTH_IDP_MACHINE_CLIENT_ID
              value: edge-page
            - name: AUTH_IDP_MACHINE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tolo-idp
                  key: edge-page-client-secret
            - name: AUTH_IDP_MACHINE_REDIRECT_URI
              value: $(WEB_ORIGIN)/api/auth/machine/callback
      volumes:
        - name: start
          $patch: delete
