apiVersion: apps/v1
kind: Deployment
metadata:
  name: tolo-idp-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tolo-idp-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tolo-idp-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
