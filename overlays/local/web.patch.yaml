apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: FIREBASE_PROJECT_ID
              value: demo-tolo
            - name: FIRESTORE_EMULATOR_HOST
              value: 127.0.0.1:8081
            - name: FIREBASE_AUTH_EMULATOR_HOST
              value: 127.0.0.1:9099
