apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: NEXT_PUBLIC_FIREBASE_PROJECT_ID
              value: demo-tolo
            - name: NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST
              value: 127.0.0.1:8081
            - name: NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST
              value: 127.0.0.1:9099
