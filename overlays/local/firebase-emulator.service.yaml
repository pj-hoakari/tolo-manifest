apiVersion: v1
kind: Service
metadata:
  name: firebase-emulator
  labels:
    app.kubernetes.io/name: firebase-emulator
spec:
  selector:
    app.kubernetes.io/name: firebase-emulator
  ports:
    - name: firestore
      port: 8080
      targetPort: firestore
    - name: auth
      port: 9099
      targetPort: auth
    - name: ui
      port: 4000
      targetPort: ui
