- op: add
  path: /spec/template/spec/hostAliases
  value:
    - ip: 127.0.0.1
      hostnames:
        - auth.tolo.localhost
- op: add
  path: /spec/template/spec/containers/-
  value:
    name: idp-loopback
    image: alpine/socat
    args: ["TCP-LISTEN:18080,bind=127.0.0.1,fork,reuseaddr", "TCP:tolo-idp:8080"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
