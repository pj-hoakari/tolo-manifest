apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tolo
resources:
  - ../local
components:
  - ../../components/idp
patches:
  - path: web.patch.yaml
  - path: idp-loopback.patch.yaml
    target:
      kind: Deployment
      name: service-gateway|web
configMapGenerator:
  - name: tolo-idp-public
    literals:
      - issuer=http://auth.tolo.localhost:18080
      - web-origin=http://tolo.localhost
secretGenerator:
  - name: tolo
    behavior: merge
    envs:
      - secrets.env
    files:
      - jwk-private-key.pem
      - seed-users.json
images:
  - name: alpine/socat
    newTag: latest
    digest: sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
