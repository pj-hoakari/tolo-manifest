apiVersion: v1
kind: Service
metadata:
  name: service-gateway
  labels:
    app.kubernetes.io/name: service-gateway
spec:
  selector:
    app.kubernetes.io/name: service-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: internal
      port: 8090
      targetPort: internal
