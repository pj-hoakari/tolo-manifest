apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-gateway
          image: ghcr.io/pj-hoakari/tolo-service-gateway
          env:
            - name: TOLO_GATEWAY_LISTENER_MODE
              value: split
            - name: TOLO_GATEWAY_PUBLIC_PORT
              value: "8080"
            - name: TOLO_GATEWAY_INTERNAL_PORT
              value: "8090"
            - name: INTERNAL_JWT_ISSUER
              value: service-gateway
            - name: INTERNAL_JWT_SIGNING_KEY_FILE
              value: /etc/tolo/keys/signing-key.pem
            - name: INTERNAL_JWT_SIGNING_KEY_ID
              value: dev-key-1
            - name: TOLO_GATEWAY_DESTINATIONS_FILE
              value: /etc/tolo/gateway/destinations.json
            - name: IDP_ISSUER
              value: http://fakeidp:8080
            - name: IDP_AUDIENCE
              value: backend-api
            - name: IDP_INTROSPECTION_CLIENT_ID
              value: gateway-introspection
            - name: IDP_INTROSPECTION_CLIENT_SECRET_FILE
              value: /etc/tolo/idp/introspection-client-secret
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: signing-key
              mountPath: /etc/tolo/keys
              readOnly: true
            - name: idp-introspection
              mountPath: /etc/tolo/idp
              readOnly: true
            - name: destinations
              mountPath: /etc/tolo/gateway
              readOnly: true
      volumes:
        - name: signing-key
          secret:
            secretName: tolo
            defaultMode: 0440
            items:
              - key: signing-key.pem
                path: signing-key.pem
        - name: idp-introspection
          secret:
            secretName: tolo
            defaultMode: 0440
            items:
              - key: introspection-client-secret
                path: introspection-client-secret
        - name: destinations
          configMap:
            name: service-gateway-destinations
