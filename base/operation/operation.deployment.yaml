apiVersion: apps/v1
kind: Deployment
metadata:
  name: operation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operation
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/pj-hoakari/tolo-operation-migrate
          args: ["-database", "$(DATABASE_URL)", "up"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tolo
                  key: operation-db-password
            - name: DATABASE_URL
              value: postgres://operation-db:5432/operation?sslmode=disable&user=operation&password=$(DB_PASSWORD)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: operation
          image: ghcr.io/pj-hoakari/tolo-operation
          env:
            - name: SERVER_ADDR
              value: :8080
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tolo
                  key: operation-db-password
            - name: DATABASE_URL
              value: postgres://operation-db:5432/operation?sslmode=disable&user=operation&password=$(DB_PASSWORD)
            - name: INTERNAL_JWKS_URL
              value: http://service-gateway:8080/.well-known/jwks.json
            - name: INTERNAL_JWT_ISSUER
              value: service-gateway
            - name: INTERNAL_JWT_AUDIENCE
              value: tolo-operation
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
