apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: operation-db
spec:
  serviceName: operation-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operation-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operation-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres
          env:
            - name: POSTGRES_DB
              value: operation
            - name: POSTGRES_USER
              value: operation
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tolo
                  key: operation-db-password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "operation", "-d", "operation"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
