apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/pj-hoakari/tolo-web
          command: ["node", "/etc/tolo/web/start-web.mjs"]
          env:
            - name: GATEWAY_URL
              value: http://service-gateway:8080
            - name: SIGNALING_URL
              value: http://edge-bridge:8787
            - name: OBSERVATION_API_MOCKING
              value: disabled
            - name: TENANT_SUBDOMAIN_MOCKING
              value: disabled
            - name: FAKEIDP_URL
              value: http://fakeidp:8080
            - name: TOLO_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: tolo-fixture
                  key: tenant-id
            - name: TOLO_EVENT_ID
              valueFrom:
                configMapKeyRef:
                  name: tolo-fixture
                  key: event-id
            - name: TOLO_OWNER_SUB
              valueFrom:
                configMapKeyRef:
                  name: tolo-fixture
                  key: owner-sub
            - name: TOLO_TOKEN_TTL_SECONDS
              value: "2592000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: start
              mountPath: /etc/tolo/web
              readOnly: true
            - name: models
              mountPath: /app/public/models
              readOnly: true
      volumes:
        - name: start
          configMap:
            name: web-start
        - name: models
          emptyDir: {}
