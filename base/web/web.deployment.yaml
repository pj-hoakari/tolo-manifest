apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/pj-hoakari/tolo-web
          env:
            - name: GATEWAY_URL
              value: http://service-gateway:8080
            - name: SIGNALING_URL
              value: http://edge-bridge:8787
            - name: OBSERVATION_API_MOCKING
              value: disabled
            - name: GRAPH_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tolo
                  key: graph-access-token
                  optional: true
            - name: OBSERVATION_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tolo
                  key: observation-access-token
                  optional: true
            - name: TENANT_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tolo
                  key: tenant-access-token
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /app/public/models
              readOnly: true
      volumes:
        - name: models
          emptyDir: {}
