apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flow-control
          image: ghcr.io/pj-hoakari/tolo-flow-control
          env:
            - name: TOLO_GRAPH_MAX_NODES
              value: "60"
            - name: TOLO_GRAPH_MAX_EDGES
              value: "150"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
