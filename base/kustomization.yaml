apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: tolo
    includeSelectors: false
resources:
  - service-gateway/service-gateway.deployment.yaml
  - service-gateway/service-gateway.service.yaml
  - fakeidp/fakeidp.deployment.yaml
  - fakeidp/fakeidp.service.yaml
  - tenant-management/tenant-management.deployment.yaml
  - tenant-management/tenant-management.service.yaml
  - tenant-management/tenant-management-db.statefulset.yaml
  - tenant-management/tenant-management-db.service.yaml
  - graph-authoring/graph-authoring.deployment.yaml
  - graph-authoring/graph-authoring.service.yaml
  - graph-authoring/graph-authoring-db.statefulset.yaml
  - graph-authoring/graph-authoring-db.service.yaml
  - nats/nats.statefulset.yaml
  - nats/nats.service.yaml
  - observation/observation.deployment.yaml
  - observation/observation.service.yaml
  - observation/observation-db.statefulset.yaml
  - observation/observation-db.service.yaml
  - operation/operation.deployment.yaml
  - operation/operation.service.yaml
  - operation/operation-db.statefulset.yaml
  - operation/operation-db.service.yaml
  - flow-control/flow-control.deployment.yaml
  - flow-control/flow-control.service.yaml
  - edge-bridge/edge-bridge.deployment.yaml
  - edge-bridge/edge-bridge.service.yaml
  - web/web.deployment.yaml
  - web/web.service.yaml
configMapGenerator:
  - name: service-gateway-destinations
    files:
      - service-gateway/destinations.json
  - name: tenant-management-seed
    files:
      - tenant-management/tenant-management.sql
  - name: tolo-fixture
    literals:
      - tenant-id=0123456789abcdef
      - tenant-subdomain=test
      - event-id=fedcba9876543210
      - owner-sub=user-owner
  - name: web-start
    files:
      - web/start-web.mjs
images:
